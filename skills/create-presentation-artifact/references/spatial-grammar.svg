<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Spatial grammar examples</title>
  <desc id="desc">Three original diagrams showing transformed inputs converging, parallel owners joining at a gate, and guarded state changes.</desc>
  <defs>
    <style>
      .title { font: 600 28px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #152238; }
      .heading { font: 600 22px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #152238; }
      .label { font: 500 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #152238; }
      .small { font: 400 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #445269; }
      .panel { fill: #f8fafc; stroke: #b8c2d1; stroke-width: 2; }
      .source { fill: #e8f1ff; stroke: #3973b8; stroke-width: 2; }
      .action { fill: #fff5d9; stroke: #b7791f; stroke-width: 2; }
      .result { fill: #e6f7ed; stroke: #278450; stroke-width: 2; }
      .state { fill: #f0ebff; stroke: #7253b5; stroke-width: 2; }
      .line { fill: none; stroke: #526175; stroke-width: 3; marker-end: url(#arrow); }
      .join { fill: #152238; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#526175"/>
    </marker>
  </defs>

  <rect width="1200" height="900" fill="#ffffff"/>
  <text x="60" y="58" class="title">Spatial grammar: make relationships visible</text>

  <rect x="50" y="90" width="1100" height="235" rx="14" class="panel"/>
  <text x="78" y="128" class="heading">A. Transform and merge</text>
  <rect x="85" y="158" width="150" height="50" rx="8" class="source"/>
  <rect x="85" y="238" width="150" height="50" rx="8" class="source"/>
  <text x="160" y="190" text-anchor="middle" class="label">Source A</text>
  <text x="160" y="270" text-anchor="middle" class="label">Source B</text>
  <rect x="315" y="158" width="160" height="50" rx="8" class="action"/>
  <rect x="315" y="238" width="160" height="50" rx="8" class="action"/>
  <text x="395" y="190" text-anchor="middle" class="label">Transform A</text>
  <text x="395" y="270" text-anchor="middle" class="label">Transform B</text>
  <rect x="610" y="198" width="150" height="50" rx="8" class="action"/>
  <text x="685" y="230" text-anchor="middle" class="label">Merge</text>
  <rect x="875" y="198" width="190" height="50" rx="8" class="result"/>
  <text x="970" y="220" text-anchor="middle" class="label">Named result</text>
  <text x="970" y="240" text-anchor="middle" class="small">with verification</text>
  <path d="M235 183 H315" class="line"/>
  <path d="M235 263 H315" class="line"/>
  <path d="M475 183 H540 V218 H610" class="line"/>
  <path d="M475 263 H540 V228 H610" class="line"/>
  <path d="M760 223 H875" class="line"/>

  <rect x="50" y="350" width="1100" height="235" rx="14" class="panel"/>
  <text x="78" y="388" class="heading">B. Parallel ownership and explicit join</text>
  <text x="88" y="454" class="label">Evidence lane</text>
  <text x="88" y="534" class="label">Review lane</text>
  <rect x="260" y="422" width="155" height="50" rx="8" class="source"/>
  <rect x="260" y="502" width="155" height="50" rx="8" class="source"/>
  <text x="337" y="454" text-anchor="middle" class="label">Collect</text>
  <text x="337" y="534" text-anchor="middle" class="label">Inspect</text>
  <rect x="500" y="422" width="155" height="50" rx="8" class="action"/>
  <rect x="500" y="502" width="155" height="50" rx="8" class="action"/>
  <text x="577" y="454" text-anchor="middle" class="label">Normalize</text>
  <text x="577" y="534" text-anchor="middle" class="label">Challenge</text>
  <circle cx="755" cy="487" r="9" class="join"/>
  <rect x="865" y="462" width="190" height="50" rx="8" class="result"/>
  <text x="960" y="494" text-anchor="middle" class="label">Decision gate</text>
  <path d="M415 447 H500" class="line"/>
  <path d="M415 527 H500" class="line"/>
  <path d="M655 447 H710 V482 H746" class="line"/>
  <path d="M655 527 H710 V492 H746" class="line"/>
  <path d="M764 487 H865" class="line"/>

  <rect x="50" y="610" width="1100" height="235" rx="14" class="panel"/>
  <text x="78" y="648" class="heading">C. Guarded state change and recovery</text>
  <rect x="105" y="700" width="160" height="58" rx="29" class="state"/>
  <rect x="470" y="700" width="160" height="58" rx="29" class="state"/>
  <rect x="865" y="700" width="185" height="58" rx="29" class="result"/>
  <rect x="470" y="784" width="160" height="44" rx="22" class="action"/>
  <text x="185" y="736" text-anchor="middle" class="label">Draft</text>
  <text x="550" y="736" text-anchor="middle" class="label">Ready</text>
  <text x="957" y="736" text-anchor="middle" class="label">Published</text>
  <text x="550" y="812" text-anchor="middle" class="label">Rework</text>
  <path d="M265 729 H470" class="line"/>
  <text x="367" y="713" text-anchor="middle" class="small">[checks pass]</text>
  <path d="M630 729 H865" class="line"/>
  <path d="M550 758 V784" class="line"/>
  <text x="650" y="790" class="small">[checks fail]</text>
  <path d="M470 806 H185 V758" class="line"/>
  <text x="300" y="798" text-anchor="middle" class="small">[rework complete]</text>
</svg>
