services:
  - type: web
    name: oura-mcp
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./plugins/oura-mcp/Dockerfile
    dockerContext: ./plugins/oura-mcp
    healthCheckPath: /healthz
    autoDeployTrigger: checksPass
    numInstances: 1
    envVars:
      - key: PORT
        value: 8000
      - key: MCP_PUBLIC_BASE_URL
        sync: false
      - key: MCP_ALLOWED_HOSTS
        sync: false
      - key: MCP_ALLOWED_ORIGINS
        value: https://chatgpt.com,https://chat.openai.com
      - key: AUTH0_ISSUER
        sync: false
      - key: AUTH0_AUDIENCE
        sync: false
      - key: AUTH0_SCOPE
        value: oura:read
      - key: OURA_BACKEND
        sync: false
      - key: OURA_MAX_QUERY_DAYS
        value: 90
      - key: OURA_CLIENT_ID
        sync: false
      - key: OURA_CLIENT_SECRET
        sync: false
      - key: OURA_REDIRECT_URI
        sync: false
      - key: OURA_SCOPES
        sync: false
      - key: OURA_TOKEN_PATH
        value: /var/lib/oura-mcp/oauth-token.enc
      - key: OURA_TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: OURA_STATE_SECRET
        generateValue: true
    disk:
      name: oura-mcp-data
      mountPath: /var/lib/oura-mcp
      sizeGB: 1
