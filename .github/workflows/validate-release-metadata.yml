name: Validate release metadata

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release-metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check manifest and marketplace alignment
        run: python3 scripts/release_metadata.py check
