name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  repository-metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v6
      - name: Install the Claude Code CLI
        run: npm install --global @anthropic-ai/claude-code@2.1.296
      - name: Validate every Agent Skill
        run: python3 scripts/validate_skills.py
      - name: Validate the marketplace and every plugin
        run: |
          python3 scripts/validate_marketplace.py
          claude plugin validate .
          for p in plugins/*/; do claude plugin validate "$p"; done
      - name: Run every plugin's tests
        run: python3 scripts/test_plugins.py
