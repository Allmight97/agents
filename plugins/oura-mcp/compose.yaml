services:
  oura-mcp:
    build: .
    restart: unless-stopped
    environment:
      OURA_CLIENT_ID: ${OURA_CLIENT_ID}
      OURA_CLIENT_SECRET: ${OURA_CLIENT_SECRET}
      OURA_REDIRECT_URI: ${OURA_REDIRECT_URI}
      SETUP_KEY: ${SETUP_KEY}
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - oura-credential:/data

  openai-tunnel:
    build:
      context: .
      dockerfile: Dockerfile.tunnel
    restart: unless-stopped
    depends_on:
      - oura-mcp
    environment:
      CONTROL_PLANE_API_KEY: ${CONTROL_PLANE_API_KEY}
    command:
      - run
      - --control-plane.tunnel-id
      - ${OPENAI_TUNNEL_ID}
      - --mcp.server-url
      - url=http://oura-mcp:8787/mcp,channel=main
      - --health.listen-addr
      - 127.0.0.1:8080

volumes:
  oura-credential:
