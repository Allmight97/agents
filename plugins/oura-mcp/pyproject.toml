[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "oura-mcp"
version = "0.1.0"
description = "Private, high-fidelity Oura MCP service for remote agent harnesses"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "cryptography>=45,<47",
  "httpx>=0.28,<0.29",
  "mcp==2.0.0",
  "PyJWT[crypto]>=2.10,<3",
  "uvicorn>=0.35,<0.36",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<0.13",
]

[project.scripts]
oura-mcp = "oura_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/oura_mcp"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
